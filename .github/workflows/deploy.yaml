name: Build and Deploy

# Modelled on MadarRust's deploy.yml. Deploys ONLY on a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# or by hand from the Actions tab (workflow_dispatch).
#
# Secrets (Settings → Secrets and variables → Actions; same names and values as MadarRust's):
#   MADAR_SHARED_TOKEN  read access to the private Shawket4/madar-shared (pricing + VAT crates)
#   GHCR_TOKEN          lets the VPS pull this repo's private image from ghcr.io
#   SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, SSH_HOST, SSH_PORT, SSH_USER   the VPS
# Variables (optional):
#   STOREFRONT_PORT     loopback port nginx proxies to (default 8090)
#   STOREFRONT_URL      a public shop URL to verify after the deploy, e.g. https://nile.shop.example.com
# The `production` environment must exist (Settings → Environments). One-time VPS setup:
# deploy/SETUP.md.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Deploys touch one box and one container, so they must not overlap. `cancel-in-progress` is
# FALSE deliberately — cancelling a run mid-deploy could leave the container stopped. A queued run
# simply waits and then deploys the newer commit.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/shawket4/leptos-storefront-preview
  DEPLOY_DIR: /opt/leptos-storefront

jobs:
  # ── Build the Docker image and push it to GHCR ──────────────────────────────
  build-push:
    name: build + push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=sha,format=long

      # The release build is thin-LTO with 4 codegen units, well inside a standard runner's memory
      # (MadarRust's swap step exists for its fat-LTO link; not needed here).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit secret for the private madar-shared dependency (the Dockerfile mounts it per
          # RUN; nothing is written to a layer).
          secrets: |
            madar_shared_token=${{ secrets.MADAR_SHARED_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to the VPS ────────────────────────────────────────────────────────
  deploy:
    name: deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy compose file
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ${DEPLOY_DIR}"
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} \
            docker-compose.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${DEPLOY_DIR}/docker-compose.yml

      - name: Pull image and restart the storefront
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          PORT: ${{ vars.STOREFRONT_PORT || '8090' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "GHCR_TOKEN='${GHCR_TOKEN}' GH_ACTOR='${GH_ACTOR}' DEPLOY_IMAGE='${DEPLOY_IMAGE}' DEPLOY_DIR='${DEPLOY_DIR}' PORT='${PORT}' bash -s" << 'SCRIPT'
          set -e

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker pull "$DEPLOY_IMAGE"

          # Point `:latest` at what is actually deployed, so a hand-run `docker compose up` (which
          # falls back to :latest) starts this image and not a stale one (MadarRust's lesson).
          docker tag "$DEPLOY_IMAGE" ghcr.io/shawket4/leptos-storefront-preview:latest

          STOREFRONT_IMAGE="$DEPLOY_IMAGE" STOREFRONT_PORT="$PORT" \
            docker compose -f "$DEPLOY_DIR/docker-compose.yml" \
            up -d --no-deps --pull never storefront

          # The catalogue and media load on boot (a few seconds); poll for up to 2 minutes.
          for i in $(seq 1 60); do
            curl -sf "http://127.0.0.1:${PORT}/health" >/dev/null && break
            sleep 2
          done
          curl -sf "http://127.0.0.1:${PORT}/health" && echo " ✅ healthy" || {
            docker compose -f "$DEPLOY_DIR/docker-compose.yml" logs storefront --tail 50
            exit 1
          }

          # Old images pile up on a small box: keep only what compose references.
          docker image prune -f > /dev/null
          SCRIPT

      # Through nginx and TLS, as a shopper reaches it (skipped until STOREFRONT_URL is set).
      - name: Verify the public site
        if: ${{ vars.STOREFRONT_URL != '' }}
        run: |
          set -e
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/home.html -w "%{http_code}" "${{ vars.STOREFRONT_URL }}/" --max-time 20 || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { echo "::error::${{ vars.STOREFRONT_URL }} returned $code"; exit 1; }
          grep -q '/js/app-' /tmp/home.html || { echo "::error::the page carries no client bundle"; exit 1; }
          echo "✅ ${{ vars.STOREFRONT_URL }} serving this release"

  # A tagged deploy that reached production gets a GitHub Release page (notes generated from the
  # commits since the last tag), like MadarRust's.
  release:
    name: GitHub Release
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Storefront preview $GITHUB_REF_NAME" --generate-notes --verify-tag
