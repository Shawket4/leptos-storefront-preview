[workspace]
resolver = "3"
members = ["crates/domain", "crates/app", "crates/frontend", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Versions checked on crates.io on 2026-10-26 (latest stable; 0.9.0-rc0 exists but is a pre-release).
[workspace.dependencies]
leptos = { version = "0.8.22", default-features = false }
leptos_meta = { version = "0.8.7", default-features = false }
leptos_router = { version = "0.8.17", default-features = false }
leptos_axum = { version = "0.8.10" }
server_fn = { version = "0.8.13" }
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip", "set-header", "trace"] }
http = "1"
moka = { version = "0.12.16", features = ["future", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3" }
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

domain = { path = "crates/domain" }
app = { path = "crates/app", default-features = false }

# Smaller, faster wasm for `cargo leptos build --release` (used as lib-profile-release below).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release]
codegen-units = 4
lto = "thin"

# Faster dev builds of the heavy proc-macro + reactive crates.
[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.dev]
debug = "line-tables-only"

[[workspace.metadata.leptos]]
name = "storefront"
bin-package = "server"
lib-package = "frontend"
output-name = "storefront"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
# Content-hashed CSS (pkg/storefront.<hash>.css, linked by leptos_meta's HashedStylesheet), so the
# server can mark it immutable; cargo-leptos writes the hashes to hash.txt beside the binary.
hash-files = true
# Bundle the @import partials in style/ into one file with Lightning CSS.
style-bundle = true
assets-dir = "public"
# The browser code (TypeScript) is bundled by crates/app/build.rs; rebuild when it changes.
watch-additional-files = ["client/src", "client/build.mjs"]
# 0.0.0.0 so the phone can reach it over Tailscale (tailscaled's ts-input chain accepts tailscale0 traffic).
site-addr = "0.0.0.0:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = []
bin-default-features = false
lib-features = []
lib-default-features = false
lib-profile-release = "wasm-release"
