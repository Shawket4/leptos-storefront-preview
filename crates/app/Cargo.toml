[package]
name = "app"
description = "Pages, components and server functions: everything is rendered on the server (the browser code is TypeScript in /client)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
domain = { workspace = true }
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }

# server-only
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
moka = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# Pricing and VAT rules from madar-shared (a private git dependency, pinned by tag — the same
# scheme as MadarRust). Server-only. Builds fetch it with git credentials (`gh auth setup-git`);
# CI and the Dockerfile use the MADAR_SHARED_TOKEN secret.
madar-catalog = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.12.0", optional = true }
madar-money = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.12.0", optional = true }
rust_decimal = { version = "1", default-features = false, optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[features]
default = []
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:leptos_axum",
  "dep:axum",
  "dep:tokio",
  "dep:moka",
  "dep:tracing",
  "dep:madar-catalog",
  "dep:madar-money",
  "dep:rust_decimal",
  "dep:uuid",
]
