[package]
name = "app"
description = "Pages, components and server functions: everything is rendered on the server (the browser code is TypeScript in /client)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
domain = { workspace = true }
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }

# server-only
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
moka = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# Madar's pricing + money rules, by path (clean crates: no actix/DB deps). Server-only so the WASM
# bundle stays lean. Local checkout of madar-shared (v0.12.0 at the time of writing).
madar-catalog = { path = "/home/apex/ClaudeProjects/madar-shared/crates/madar-catalog", optional = true }
madar-money = { path = "/home/apex/ClaudeProjects/madar-shared/crates/madar-money", optional = true }
rust_decimal = { version = "1", default-features = false, optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[features]
default = []
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:leptos_axum",
  "dep:axum",
  "dep:tokio",
  "dep:moka",
  "dep:tracing",
  "dep:madar-catalog",
  "dep:madar-money",
  "dep:rust_decimal",
  "dep:uuid",
]
