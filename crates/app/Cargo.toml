[package]
name = "app"
description = "Shared components, pages, islands and server functions."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
domain = { workspace = true }
leptos = { workspace = true, features = ["islands", "islands-router"] }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
  "Document", "Element", "HtmlElement", "HtmlDocument", "Window", "Location", "History",
  "KeyboardEvent", "MouseEvent", "PointerEvent", "TouchEvent", "TouchList", "Touch", "Event",
  "EventTarget", "DomRect", "HtmlInputElement", "HtmlFormElement", "HtmlDialogElement",
  "ScrollBehavior", "ScrollToOptions", "ScrollIntoViewOptions", "ScrollLogicalPosition",
  "MediaQueryList", "Storage", "Navigator", "UrlSearchParams", "Url", "CssStyleDeclaration",
  "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit",
  "ResizeObserver", "ResizeObserverEntry", "DomTokenList", "HtmlCollection", "NodeList",
  "MutationObserver", "MutationObserverInit", "MutationRecord",
] }

# server-only
leptos_axum = { workspace = true, optional = true, features = ["islands-router"] }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
moka = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# Madar's pricing + money rules, by path (clean crates: no actix/DB deps). Server-only so the WASM
# bundle stays lean. Local checkout of madar-shared (v0.12.0 at the time of writing).
madar-catalog = { path = "/home/apex/ClaudeProjects/madar-shared/crates/madar-catalog", optional = true }
madar-money = { path = "/home/apex/ClaudeProjects/madar-shared/crates/madar-money", optional = true }
rust_decimal = { version = "1", default-features = false, optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[features]
default = []
hydrate = ["leptos/hydrate"]
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:leptos_axum",
  "dep:axum",
  "dep:tokio",
  "dep:moka",
  "dep:tracing",
  "dep:madar-catalog",
  "dep:madar-money",
  "dep:rust_decimal",
  "dep:uuid",
]
