[package]
name = "frontend"
description = "Empty placeholder for cargo-leptos, which expects a WASM lib package. The storefront ships no WASM: the browser code is TypeScript in /client, bundled into the server."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
