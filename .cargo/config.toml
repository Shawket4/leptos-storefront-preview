# sccache + mold for host builds (same setup as the Madar repos' scripts/dev-env.sh).
[build]
rustc-wrapper = "sccache"
# One build dir per worktree (keyed by its path). A single shared dir looked attractive, but every
# worktree has the same relative layout, so cargo gave each worktree's `app` the same artifact name
# and dev servers silently linked another worktree's code. sccache keeps dependency rebuilds cheap.
build-dir = "/home/apex/work/lsp-build/{workspace-path-hash}"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=/home/apex/.local/bin/mold"]

[env]
SCCACHE_DIR = "/home/apex/.cache/sccache"
